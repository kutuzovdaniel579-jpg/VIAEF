<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VIÆF • German</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #51A6E8;
            --primary-hover: #3b82f6;
            --bg: #0f172a; /* Iets zachter zwart/donkerblauw voor minder oogvermoeidheid */
            --card-bg: #1e293b;
            --text: #f8fafc;
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            animation: fadeIn 0.6s ease-out;
        }

        h1 { 
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 1.5rem; 
            text-align: center;
            letter-spacing: -0.025em;
        }

        .menu-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            margin-bottom: 12px;
            background: var(--card-bg);
            color: white;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-link:hover {
            background: var(--primary);
            border-color: transparent;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3), 
                        0 0 15px rgba(81, 166, 232, 0.2);
        }

        /* Subtiele pijl-animatie */
        .menu-link::after {
            content: '→';
            opacity: 0.5;
            transition: transform 0.3s ease;
        }

        .menu-link:hover::after {
            transform: translateX(5px);
            opacity: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Duits – Hoofdmenu</h1>

        <a href="kapitel/" class="menu-link">
            <span>Woorden</span>
        </a>
        
        <a href="grammatica/" class="menu-link">
            <span>Grammatica</span>
        </a>
    </div>

</body>
</html>
