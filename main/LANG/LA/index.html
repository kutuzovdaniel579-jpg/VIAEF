<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VIÆF • Latin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #51A6E8;
            --primary-glow: rgba(81, 166, 232, 0.2);
            --bg: #0d1117; 
            --card-bg: #161b22;
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at top, #1c2128 0%, #0d1117 100%);
        }

        .container {
            width: 90%;
            max-width: 440px;
            padding: 2rem;
            animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 { 
            font-size: 1.85rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.04em;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 600;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.15rem 1.5rem;
            background: var(--card-bg);
            color: white;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 500;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-item:hover {
            background: #1f2937;
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), 
                        0 0 12px var(--primary-glow);
        }

        /* Indicatorteken */
        .nav-item::after {
            content: '→';
            font-size: 1.1rem;
            color: var(--primary);
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.25s ease;
        }

        .nav-item:hover::after {
            opacity: 1;
            transform: translateX(0);
        }

        /* Animaties */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .container { padding: 1.5rem; }
            h1 { font-size: 1.6rem; }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>Latijn</h1>
            <div class="subtitle">Hoofdmenu</div>
        </header>

        <nav class="nav-menu">

            </a>
            <a href="caput/" class="nav-item">
                <span>Woorden</span>
            </a>
            <a href="gram/" class="nav-item">
                <span>Grammatica</span>
            </a>
            <a href="culture/" class="nav-item">
                <span>Cultuur</span>
            </a>
        </nav>
    </div>

</body>
</html>
