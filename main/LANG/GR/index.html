<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VIÆF • Greek</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #51A6E8;
            --primary-glow: rgba(81, 166, 232, 0.3);
            --bg: #0a0f18; /* Dieper, moderner zwart */
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Subtiele achtergrond gradiënt voor diepte */
            background: radial-gradient(circle at top right, #1e293b 0%, #0a0f18 100%);
        }

        .container {
            width: 90%;
            max-width: 420px;
            padding: 2rem;
            animation: fadeIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 { 
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.03em;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.1rem 1.5rem;
            background: var(--card-bg);
            color: white;
            border-radius: 14px;
            border: 1px solid var(--card-border);
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px); /* Glassmorphism effect */
        }

        .nav-item:hover {
            background: var(--primary);
            border-color: transparent;
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4), 
                        0 0 20px var(--primary-glow);
        }

        /* Kleine pijl indicator */
        .nav-item::after {
            content: '→';
            font-size: 1.2rem;
            opacity: 0.3;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .nav-item:hover::after {
            transform: translateX(4px);
            opacity: 1;
        }

        /* Animaties */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobiele optimalisatie */
        @media (max-width: 480px) {
            .container { padding: 1rem; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>Grieks</h1>
            <div class="subtitle">Hoofdmenu</div>
        </header>

        <nav class="nav-menu">
            <a href="kefálio/" class="nav-item">
                <span>Woorden</span>
            </a>
            <a href="gram/" class="nav-item">
                <span>Grammatica</span>
            </a>
        </nav>
    </div>

</body>
</html>
