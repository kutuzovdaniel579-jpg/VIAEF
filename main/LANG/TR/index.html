<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VIÆF • Turkish</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #51A6E8;
            --primary-glow: rgba(81, 166, 232, 0.25);
            --bg: #0d1117;
            --card-bg: #161b22;
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at bottom right, #1c2128 0%, #0d1117 100%);
        }

        .container {
            width: 90%;
            max-width: 400px;
            padding: 2rem;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 { 
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.04em;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 600;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 1.5rem;
            background: var(--card-bg);
            color: white;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .nav-item:hover {
            background: #1f2937;
            border-color: var(--primary);
            transform: scale(1.03);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5), 
                        0 0 15px var(--primary-glow);
        }

        /* Icoon-achtige pijl */
        .nav-item .arrow {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .nav-item:hover .arrow {
            background: var(--primary);
            transform: translateX(5px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>Turks</h1>
            <div class="subtitle">Hoofdmenu</div>
        </header>

        <nav class="nav-menu">
            <a href="bolum/" class="nav-item">
                <span>Woorden</span>
                <span class="arrow">→</span>
            </a>
            
            </nav>
    </div>

</body>
</html>
