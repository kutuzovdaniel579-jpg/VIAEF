<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VIÆF – Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Inter", Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
    }

    header {
      width: 100%;
      padding: 18px 30px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      box-sizing: border-box;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }

    .wrapper {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 25px;
      margin-bottom: 50px;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 25px;
      cursor: pointer;
      transition: 0.25s ease;
      text-align: center;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card:hover {
      border-color: #58a6ff;
      box-shadow: 0 0 18px rgba(88, 166, 255, 0.25);
      transform: translateY(-5px);
    }

    .card-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    /* ===== ABOUT SECTIE (Zelfde stijl als je modal box) ===== */
    .about-box {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 30px 40px;
      margin-top: 20px;
    }

    /* Markdown Styling binnen de box */
    #aboutContent h1, #aboutContent h2 { border-bottom: 1px solid #30363d; padding-bottom: 10px; }
    #aboutContent code { background: #0d1117; padding: 3px 6px; border-radius: 6px; font-family: monospace; }
    #aboutContent pre { background: #0d1117; padding: 15px; border-radius: 8px; border: 1px solid #30363d; overflow-x: auto; }
    #aboutContent a { color: #58a6ff; text-decoration: none; }
    #aboutContent a:hover { text-decoration: underline; }
    #aboutContent img { max-width: 100%; border-radius: 8px; }
  </style>
</head>

<body>

<header>
  <h1>VIÆF Dashboard</h1>
</header>

<div class="wrapper">
  <div class="grid" id="categorieGrid"></div>

  <div class="about-box">
    <div id="aboutContent">Laden van informatie...</div>
  </div>
</div>

<script>
/* ===== CATEGORIEËN ===== */
const categorieën = [
  { naam: "Aardrijkskunde", icon: "🌍", link: "https://kutuzovdaniel579-jpg.github.io/VIAEF/main/GE" },
  { naam: "Geschiedenis", icon: "🏛️", link: "https://kutuzovdaniel579-jpg.github.io/VIAEF/main/HS" },
  { naam: "ICT", icon: "💻", link: "https://kutuzovdaniel579-jpg.github.io/VIAEF/main/ICT" },
  { naam: "Talen", icon: "📚", link: "https://kutuzovdaniel579-jpg.github.io/VIAEF/main/LANG" },
];

/* ===== DASHBOARD GENEREREN ===== */
const grid = document.getElementById("categorieGrid");

categorieën.forEach(c => {
  const card = document.createElement("a");
  card.href = c.link;
  card.className = "card";
  card.innerHTML = `
    <div class="card-icon">${c.icon}</div>
    <h2>${c.naam}</h2>
  `;
  grid.appendChild(card);
});

/* ===== ABOUT OPHALEN & RENDEREN ===== */
const aboutUrl = "https://raw.githubusercontent.com/kutuzovdaniel579-jpg/VIAEF/refs/heads/main/README.md";

fetch(aboutUrl)
  .then(res => res.text())
  .then(md => {
    // Hier gebeurt de magie: marked.parse zet de raw text om naar HTML
    document.getElementById("aboutContent").innerHTML = marked.parse(md);
  })
  .catch(err => {
    document.getElementById("aboutContent").innerHTML = "Kon de informatie niet laden.";
  });

</script>

</body>
</html>
