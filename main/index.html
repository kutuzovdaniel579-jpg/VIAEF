<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VIÆF</title>
  
  <meta property="og:title" content="VIÆF – Centrale Hub">
  <meta property="og:description" content="Kies je vak, taal of richting. VIÆF brengt alles overzichtelijk samen.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kutuzovdaniel579-jpg.github.io/VIAEF/">
  <meta property="og:image" content="https://kutuzovdaniel579-jpg.github.io/VIAEF/assets/icon-og.png">
  <meta property="og:site_name" content="VIÆF">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="VIÆF – Centrale Hub">
  <meta name="twitter:description" content="Kies je vak, taal of richting. VIÆF brengt alles overzichtelijk samen.">
  <meta name="twitter:image" content="https://kutuzovdaniel579-jpg.github.io/VIAEF/assets/og-image.png">

  <link rel="icon" href="https://kutuzovdaniel579-jpg.github.io/VIAEF/assets/icon.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      /* Achtergrond afbeelding configuratie */
      background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url("https://raw.githubusercontent.com/kutuzovdaniel579-jpg/VIAEF/refs/heads/main/assets/icon-og.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-color: black; /* Fallback kleur */
      
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      overflow: hidden;
    }

    #keuzeScherm, #taalKeuze {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeIn 0.6s ease-out forwards;
      /* Glas-effect voor de containers voor betere leesbaarheid op drukke achtergronden */
      background: rgba(255, 255, 255, 0.05);
      padding: 30px;
      border-radius: 15px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      margin-bottom: 20px;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .taal-btn {
      padding: 12px 20px;
      margin: 8px;
      background: #51A6E8;
      color: white;
      border-radius: 6px;
      border: 1px solid #0f6f99;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.3s ease;
      width: 220px;
      font-weight: bold;
    }

    .taal-btn:hover {
      background: #3a91d4;
      border-color: #ffffff;
      box-shadow: 0 0 15px rgba(81, 166, 232, 0.4);
      transform: translateY(-3px);
    }
  </style>
</head>

<body>
    
  <div id="keuzeScherm">
    <h1>Kies een categorie</h1>
    <div id="categorieKnoppen"></div>
  </div>

  <div id="taalKeuze">
    <h1>Kies een taal</h1>
    <div id="taalKnoppen"></div>
  </div>

<script>
/* (Script blijft hetzelfde als jouw origineel) */
const categorieën = [
  { naam: "Aardrijkskunde", link: "https://kutuzovdaniel579-jpg.github.io/VIAEF/main/GE" },
  { naam: "Geschiedenis", link: "https://kutuzovdaniel579-jpg.github.io/VIAEF/main/HS" },
  { naam: "ICT", link: "https://kutuzovdaniel579-jpg.github.io/VIAEF/main/ICT" },
  { naam: "Talen", type: "talen" }
];

const talen = [
  { naam: "Latijn", link: "/LANG/LA/index.html" },
  { naam: "Grieks", link: "/LANG/GR/index.html" },

  { naam: "Turks", link: "/LANG/TR/index.html" },
  { naam: "Uzbeeks", link: "/LANG/UZ/index.html" },
  { naam: "Russisch", link: "/LANG/RU/index.html" },

  { naam: "Engels", link: "/LANG/EN/index.html" },
  { naam: "Nederlands", link: "/LANG/NL/index.html" },
  { naam: "Frans", link: "/LANG/FR/index.html" }
];

function startApp() {
  document.getElementById("keuzeScherm").style.display = "flex";
  const container = document.getElementById("categorieKnoppen");
  container.innerHTML = "";

  categorieën.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "taal-btn";
    btn.textContent = c.naam;
    btn.onclick = () => {
      if (c.type === "talen") {
        document.getElementById("keuzeScherm").style.display = "none";
        document.getElementById("taalKeuze").style.display = "flex";
        const taalContainer = document.getElementById("taalKnoppen");
        taalContainer.innerHTML = "";
        talen.forEach(t => {
          const tbtn = document.createElement("button");
          tbtn.className = "taal-btn";
          tbtn.textContent = t.naam;
          tbtn.onclick = () => window.location.href = t.link;
          taalContainer.appendChild(tbtn);
        });
      } else {
        window.location.href = c.link;
      }
    };
    container.appendChild(btn);
  });
}

document.addEventListener("DOMContentLoaded", startApp);
</script>

</body>
</html>
