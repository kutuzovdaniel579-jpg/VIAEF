<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VIÆF • Dashboard</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg: #080808;
      --card-bg: rgba(255, 255, 255, 0.03);
      --accent: #51A6E8;
      --neon-glow: rgba(81, 166, 232, 0.3);
      --border: rgba(255, 255, 255, 0.1);
    }

    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: var(--bg);
      color: white;
      line-height: 1.6;
    }

    header {
      width: 100%;
      padding: 60px 20px 20px;
      text-align: center;
      box-sizing: border-box;
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -1px;
    }

    .wrapper {
      max-width: 1100px;
      margin: 20px auto 60px;
      padding: 0 20px;
    }

    /* ===== GRID & CARDS ===== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 60px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 25px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
      text-decoration: none;
      color: inherit;
      backdrop-filter: blur(10px);
    }

    .card:hover {
      border-color: var(--accent);
      background: rgba(81, 166, 232, 0.05);
      box-shadow: 0 0 30px var(--neon-glow);
      transform: translateY(-10px);
    }

    .card-icon {
      font-size: 45px;
      margin-bottom: 15px;
      display: block;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
    }

    .card h2 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* ===== ABOUT BOX (Glassmorphism) ===== */
    .about-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      margin-top: 40px;
      backdrop-filter: blur(10px);
    }

    #aboutContent {
      color: #ccc;
      font-size: 0.95rem;
    }

    #aboutContent h1, #aboutContent h2 { 
      color: var(--accent);
      border-bottom: 1px solid var(--border); 
      padding-bottom: 10px; 
      margin-top: 30px;
    }

    #aboutContent strong { color: white; }

    #aboutContent code { 
      background: rgba(255,255,255,0.1); 
      padding: 3px 6px; 
      border-radius: 6px; 
      font-family: monospace; 
      color: var(--accent);
    }

    #aboutContent pre { 
      background: #000; 
      padding: 20px; 
      border-radius: 12px; 
      border: 1px solid var(--border); 
      overflow-x: auto; 
    }

    #aboutContent a { 
      color: var(--accent); 
      text-decoration: none; 
      font-weight: 600;
    }

    #aboutContent a:hover { text-decoration: underline; }

    #aboutContent img { 
      max-width: 100%; 
      border-radius: 12px; 
      border: 1px solid var(--border);
    }

    /* Mobile adjustments */
    @media (max-width: 600px) {
      header h1 { font-size: 1.8rem; }
      .about-box { padding: 25px; }
    }
  </style>
</head>

<body>

<header>
  <h1>VIÆF Dashboard</h1>
</header>

<div class="wrapper">
  <div class="grid" id="categorieGrid"></div>

  <div class="about-box">
    <div id="aboutContent">Laden van informatie...</div>
  </div>
</div>

<script>
/* ===== CATEGORIEËN ===== */
const categorieën = [
  { naam: "Aardrijkskunde", icon: "🌍", link: "https://kutuzovdaniel579-jpg.github.io/VIAEF/main/GE" },
  { naam: "Geschiedenis", icon: "🏛️", link: "https://kutuzovdaniel579-jpg.github.io/VIAEF/main/HS" },
  { naam: "ICT", icon: "💻", link: "https://kutuzovdaniel579-jpg.github.io/VIAEF/main/ICT" },
  { naam: "Talen", icon: "📚", link: "https://kutuzovdaniel579-jpg.github.io/VIAEF/main/LANG" },
];

const grid = document.getElementById("categorieGrid");

categorieën.forEach((c, index) => {
  const card = document.createElement("a");
  card.href = c.link;
  card.className = "card";
  card.style.animationDelay = `${index * 0.1}s`;
  card.innerHTML = `
    <span class="card-icon">${c.icon}</span>
    <h2>${c.naam}</h2>
  `;
  grid.appendChild(card);
});

/* ===== ABOUT OPHALEN & RENDEREN ===== */
const aboutUrl = "https://raw.githubusercontent.com/kutuzovdaniel579-jpg/VIAEF/refs/heads/main/README.md";

fetch(aboutUrl)
  .then(res => res.text())
  .then(md => {
    document.getElementById("aboutContent").innerHTML = marked.parse(md);
  })
  .catch(err => {
    document.getElementById("aboutContent").innerHTML = "<div style='color:var(--error)'>Kon de informatie niet laden.</div>";
  });
</script>

</body>
</html>
