<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VIÆF • History</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #51A6E8;
            --bg: #050505;
            --card-bg: #111111;
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #666666;
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at top right, #111 0%, #050505 100%);
        }

        .container {
            width: 90%;
            max-width: 450px;
            padding: 2rem;
            animation: slideIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 { 
            font-size: 2rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.05em;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 1.75rem;
            background: var(--card-bg);
            color: white;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        /* Hover effecten */
        .menu-item:hover {
            transform: scale(1.03) translateY(-4px);
            border-color: var(--primary);
            background: #161616;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(81, 166, 232, 0.2);
        }

        /* Speciale stijl voor Coming Soon */
        .coming-soon {
            opacity: 0.6;
            cursor: not-allowed;
            border-style: dashed;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .coming-soon:hover {
            transform: none;
            border-color: var(--card-border);
            box-shadow: none;
        }

        /* De pijl indicator */
        .arrow {
            font-size: 1.2rem;
            color: var(--primary);
            transition: transform 0.3s ease;
        }

        .menu-item:not(.coming-soon):hover .arrow {
            transform: translateX(6px);
        }

        /* De subtiele gloed achter de tekst */
        .menu-item::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
            transition: 0.5s;
        }

        .menu-item:hover::before {
            left: 100%;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <span class="subtitle">VIAEF</span>
            <h1>History</h1>
        </header>

        <nav class="menu-grid">
            <a href="https://kutuzovdaniel579-jpg.github.io/VIAEF/main/HS/TT/" class="menu-item">
                <span>Timelines</span>
                <span class="arrow">→</span>
            </a>

            <a href="https://kutuzovdaniel579-jpg.github.io/VIAEF/ERROR/1.html" class="menu-item coming-soon">
                <span>Civilizations</span>
                <span class="arrow">Locked</span>
            </a>

            <a href="https://kutuzovdaniel579-jpg.github.io/VIAEF/ERROR/1.html" class="menu-item coming-soon">
                <span>Great Wars</span>
                <span class="arrow">Locked</span>
            </a>
        </nav>
    </div>

</body>
</html>
