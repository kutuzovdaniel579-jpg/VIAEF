<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>VIAEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta name="title" content="VIAEF">
  <meta name="description" content="">

  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/kutuzovdaniel579-jpg/VIAEF/refs/heads/main/icon.png">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/kutuzovdaniel579-jpg/VIAEF/refs/heads/main/icon.png">

  <meta property="og:type" content="website">
  <meta property="og:title" content="VIAEF">
  <meta property="og:description" content=https://raw.githubusercontent.com/kutuzovdaniel579-jpg/VIAEF/refs/heads/main/README.md>
  <meta property="og:url" content="https://kutuzovdaniel579-jpg.github.io/VIAEF/">
  <meta property="og:image" content="https://kutuzovdaniel579-jpg.github.io/VIAEF/assets/icon-og.png">

  <style>
    :root {
      --bg-color: #080808;
      --text-color: #ffffff;
      --transition-speed: 1s; /* Duur van de animatie */
      --logo-size: 100px;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    .loader-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .logo {
      width: var(--logo-size);
      height: var(--logo-size);
      border-radius: 50%;
      background-image: url('https://raw.githubusercontent.com/kutuzovdaniel579-jpg/VIAEF/refs/heads/main/icon.png');
      background-size: cover;
      background-position: center;
      z-index: 10;
      transition: transform var(--transition-speed) cubic-bezier(0.65, 0, 0.35, 1);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
    }

    .brand-text {
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 800;
      color: var(--text-color);
      letter-spacing: 0.2em;
      white-space: nowrap;
      width: 0;
      opacity: 0;
      overflow: hidden;
      transition: width var(--transition-speed) cubic-bezier(0.65, 0, 0.35, 1), 
                  opacity var(--transition-speed) ease-in-out;
      text-transform: uppercase;
      line-height: 1;
    }

    .active .logo {
      transform: translateX(-20px);
    }

    .active .brand-text {
      width: 280px; 
      opacity: 1;
      margin-left: 30px;
    }

    #overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-color);
      color: #555;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 0.75rem;
      transition: opacity 0.6s ease;
    }

    #overlay:hover { color: #fff; }
  </style>
</head>
<body>

  <div id="overlay">
    <span>Klik om te starten</span>
  </div>

  <div class="loader-wrapper" id="container">
    <div class="logo"></div>
    <div class="brand-text">VIÆF</div>
  </div>

  <audio id="sfx" src="https://raw.githubusercontent.com/kutuzovdaniel579-jpg/VIAEF/refs/heads/main/assets/loadingscreen.mp3"></audio>

  <script>
    const overlay = document.getElementById('overlay');
    const container = document.getElementById('container');
    const sfx = document.getElementById('sfx');

    // CONFIGURATIE REDIRECT
    const redirectUrl = "https://jouwbestemming.nl"; // VERANDER DEZE LINK

    overlay.addEventListener('click', () => {
      // 1. Verwijder overlay
      overlay.style.opacity = '0';
      setTimeout(() => overlay.style.display = 'none', 600);
      
      // 2. Start direct het geluid
      sfx.play().catch(e => console.log("Audio play blocked"));

      // 3. Wacht heel even (bijv. 300ms) en start dan de animatie
      setTimeout(() => {
        container.classList.add('active');

        // 4. De animatie duurt 1s (zie CSS). 
        // We wachten tot de animatie klaar is (1000ms) + 1 seconde extra pauze
        setTimeout(() => {
          window.location.href = redirectUrl;
        }, 2000); // 1000ms animatie + 1000ms extra pauze

      }, 300); 
    });
  </script>

</body>
</html>
